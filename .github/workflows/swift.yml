name: Swift

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version && xcodebuild -version
      - name: Package tests
        run: swift test
      - name: macOS framework tests
        run: >-
          xcodebuild -quiet -project pyb00st.xcodeproj -scheme pyb00st
          -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/pyb00st-derived-data"
          CODE_SIGNING_ALLOWED=NO MACOSX_DEPLOYMENT_TARGET=14.2 test
      - name: iOS device framework
        run: >-
          xcodebuild -quiet -project pyb00st.xcodeproj -scheme pyb00st
          -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/pyb00st-derived-data"
          CODE_SIGNING_ALLOWED=NO IPHONEOS_DEPLOYMENT_TARGET=15.0 build
      - name: iOS Simulator framework
        run: >-
          xcodebuild -quiet -project pyb00st.xcodeproj -scheme pyb00st
          -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/pyb00st-derived-data"
          CODE_SIGNING_ALLOWED=NO IPHONEOS_DEPLOYMENT_TARGET=15.0 build
